<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#37474f"/>
    </marker>
    <marker id="flechaRoja" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b23c17"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Entorno de desarrollo: cliente W10ED y servidor JRO-USED</text>

  <!-- Cliente -->
  <rect x="20" y="55" width="280" height="320" rx="10" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="160" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">W10ED · Cliente</text>
  <text x="160" y="105" text-anchor="middle" font-size="12" fill="#1a1a1a">Windows 10 Pro (equipo del aula)</text>
  <g font-size="13" fill="#1a1a1a">
    <rect x="45" y="125" width="230" height="46" rx="6" fill="#ffffff" stroke="#1f4e79"/>
    <text x="160" y="153" text-anchor="middle">Navegador (Google Chrome)</text>
    <rect x="45" y="183" width="230" height="46" rx="6" fill="#ffffff" stroke="#1f4e79"/>
    <text x="160" y="211" text-anchor="middle">MobaXterm (SSH y SFTP)</text>
    <rect x="45" y="241" width="230" height="46" rx="6" fill="#ffffff" stroke="#1f4e79"/>
    <text x="160" y="269" text-anchor="middle">NetBeans (IDE)</text>
    <rect x="45" y="299" width="230" height="46" rx="6" fill="#ffffff" stroke="#1f4e79"/>
    <text x="160" y="327" text-anchor="middle">Visual Studio Code (editor)</text>
  </g>

  <!-- Servidor -->
  <rect x="700" y="55" width="280" height="320" rx="10" fill="#eaf7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="840" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">JRO-USED · Servidor</text>
  <text x="840" y="105" text-anchor="middle" font-size="12" fill="#1a1a1a">Ubuntu Server · 10.199.8.97</text>
  <g font-size="13" fill="#1a1a1a">
    <rect x="725" y="125" width="230" height="46" rx="6" fill="#ffffff" stroke="#2e7d32"/>
    <text x="840" y="153" text-anchor="middle">Apache + PHP-FPM</text>
    <rect x="725" y="183" width="230" height="46" rx="6" fill="#ffffff" stroke="#2e7d32"/>
    <text x="840" y="211" text-anchor="middle">OpenSSH (SSH y SFTP)</text>
    <rect x="725" y="241" width="230" height="46" rx="6" fill="#ffffff" stroke="#2e7d32"/>
    <text x="840" y="269" text-anchor="middle">MariaDB</text>
    <rect x="725" y="299" width="230" height="46" rx="6" fill="#ffffff" stroke="#2e7d32"/>
    <text x="840" y="327" text-anchor="middle">Xdebug (extensión de PHP)</text>
  </g>

  <!-- Conexiones -->
  <g font-size="12" fill="#1a1a1a" text-anchor="middle">
    <line x1="305" y1="148" x2="693" y2="148" stroke="#37474f" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="500" y="140" font-weight="bold">HTTPS 443 / HTTP 80</text>
    <text x="500" y="164">Ver y probar las páginas</text>

    <line x1="305" y1="206" x2="693" y2="206" stroke="#37474f" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="500" y="198" font-weight="bold">SSH / SFTP 22</text>
    <text x="500" y="222">Administrar y subir archivos</text>

    <line x1="305" y1="264" x2="693" y2="264" stroke="#37474f" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="500" y="256" font-weight="bold">MariaDB 3306</text>
    <text x="500" y="280">Consultar la base de datos</text>

    <line x1="695" y1="322" x2="307" y2="322" stroke="#b23c17" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#flechaRoja)"/>
    <text x="500" y="314" font-weight="bold" fill="#b23c17">Xdebug 9003</text>
    <text x="500" y="338" fill="#b23c17">El servidor llama al IDE para depurar</text>
  </g>
</svg>
