<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 270" width="1010" height="270" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="1010" height="270" fill="#ffffff"/>
  <text x="505" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Las cuatro zonas de Git</text>

  <text x="375" y="62" text-anchor="middle" font-size="12" fill="#555555">En tu equipo (W10ED)</text>
  <line x1="20" y1="70" x2="730" y2="70" stroke="#9aa5ad" stroke-width="1.5"/>
  <text x="895" y="62" text-anchor="middle" font-size="12" fill="#555555">En Internet</text>
  <line x1="800" y1="70" x2="990" y2="70" stroke="#9aa5ad" stroke-width="1.5"/>

  <g font-size="13" fill="#1a1a1a" text-anchor="middle">
    <rect x="20" y="85" width="190" height="90" rx="10" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/>
    <text x="115" y="115" font-size="14" font-weight="bold" fill="#1f4e79">Directorio de trabajo</text>
    <text x="115" y="140">Los archivos que</text>
    <text x="115" y="158">estás editando</text>

    <rect x="280" y="85" width="190" height="90" rx="10" fill="#fff4e0" stroke="#b26a00" stroke-width="2"/>
    <text x="375" y="115" font-size="14" font-weight="bold" fill="#b26a00">Área de preparación</text>
    <text x="375" y="140">Lo que entrará en el</text>
    <text x="375" y="158">próximo commit (stage)</text>

    <rect x="540" y="85" width="190" height="90" rx="10" fill="#eaf7ee" stroke="#2e7d32" stroke-width="2"/>
    <text x="635" y="115" font-size="14" font-weight="bold" fill="#2e7d32">Repositorio local</text>
    <text x="635" y="140">Historial de versiones</text>
    <text x="635" y="158">(carpeta .git)</text>

    <rect x="800" y="85" width="190" height="90" rx="10" fill="#f3eafb" stroke="#6a1b9a" stroke-width="2"/>
    <text x="895" y="115" font-size="14" font-weight="bold" fill="#6a1b9a">Repositorio remoto</text>
    <text x="895" y="140">GitHub: copia en la nube</text>
    <text x="895" y="158">y trabajo en equipo</text>
  </g>

  <g font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <line x1="213" y1="130" x2="275" y2="130" stroke="#37474f" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="245" y="120">add</text>
    <line x1="473" y1="130" x2="535" y2="130" stroke="#37474f" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="505" y="120">commit</text>
    <line x1="733" y1="130" x2="795" y2="130" stroke="#37474f" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="765" y="120">push</text>
  </g>

  <path d="M895,178 L895,205 L635,205 L635,181" fill="none" stroke="#37474f" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#flecha)"/>
  <text x="765" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">fetch</text>

  <path d="M915,178 L915,240 L115,240 L115,181" fill="none" stroke="#37474f" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#flecha)"/>
  <text x="375" y="258" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan font-weight="bold">pull</tspan> = fetch + fusionar los cambios en tus archivos</text>
</svg>
